<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC Monthly Quiz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        :root {
            --bg-main: #000000; --bg-container: #090014; --bg-input: #120024;
            --text-main: #ffffff; --border-color: #4c1d95; --stc-purple: #4F008C;
            --neon-purple: #a855f7; --option-bg: #1e003b; --option-hover: #3b0764;
            --option-selected: #6b21a8; --shadow-neon: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .quiz-wrapper { background-color: var(--bg-container); border: 1px solid var(--border-color); }
        .option-btn { background-color: var(--option-bg); border: 1px solid var(--border-color); transition: all 0.2s ease; }
        .option-btn:hover { background-color: var(--option-hover); }
        .option-btn.selected { background-color: var(--option-selected); border-color: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }
        .btn-neon { background-color: var(--stc-purple); transition: all 0.3s; }
        .btn-neon:hover:not(:disabled) { background-color: #6b21a8; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95">
        <div class="bg-[#090014] border-2 border-purple-600 rounded-2xl p-8 max-w-md w-full mx-4 text-center">
            <h2 class="text-3xl font-bold mb-6 text-purple-400">STC Quiz Portal</h2>
            <input type="text" id="login-user" class="w-full bg-[#120024] border border-purple-900 rounded-xl p-3 mb-4" placeholder="Username (e.g. name.c@stc.com.kw)">
            <input type="password" id="login-pass" class="w-full bg-[#120024] border border-purple-900 rounded-xl p-3 mb-4" placeholder="Password">
            <button onclick="attemptLogin()" class="w-full bg-purple-700 py-3 rounded-xl font-bold text-white">Login</button>
        </div>
    </div>

    <!-- QUIZ PORTAL -->
    <div id="quiz-portal" class="hidden flex-col h-screen p-4">
        <header class="flex justify-between items-center p-4 border-b border-purple-800">
            <div><h1 class="text-xl font-bold text-purple-400">STC Monthly Quiz</h1><p id="date-display" class="text-sm"></p></div>
            <div class="text-right"><p>Agent: <span id="agent-name" class="font-bold"></span></p><div id="timer-display" class="text-xl text-green-400">15:00</div></div>
        </header>

        <main class="flex-grow flex justify-center p-4">
            <div id="quiz-container" class="quiz-wrapper w-full max-w-4xl rounded-2xl p-8 flex flex-col">
                <div id="question-text" class="text-xl font-bold mb-6"></div>
                <div id="options-container" class="flex flex-col gap-3 flex-grow"></div>
                <div class="flex justify-between pt-6">
                    <button id="prev-btn" onclick="prevQuestion()" class="px-6 py-2 rounded-lg border border-purple-600">السابق</button>
                    <button id="next-btn" onclick="nextQuestion()" class="btn-neon px-6 py-2 rounded-lg">التالي</button>
                    <button id="submit-btn" onclick="submitQuiz()" class="bg-green-600 px-6 py-2 rounded-lg hidden">إنهاء</button>
                </div>
            </div>
            
            <!-- RESULTS -->
            <div id="results-container" class="quiz-wrapper w-full max-w-4xl rounded-2xl p-8 hidden overflow-y-auto">
                <h2 class="text-3xl font-bold mb-6 text-center">النتائج</h2>
                <div id="mistakes-list" class="flex flex-col gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        const quizData = [ /* Paste your 25 objects here from previous response */ ];
        let currentQuestionIndex = 0;
        let userAnswers = new Array(25).fill(null);
        let timeRemaining = 900;

        function attemptLogin() {
            const user = document.getElementById('login-user').value;
            if (user.includes('.c@stc.com.kw') && document.getElementById('login-pass').value === 'Stc123') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('quiz-portal').classList.remove('hidden');
                document.getElementById('quiz-portal').classList.add('flex');
                startTimer();
                renderQuestion();
            }
        }

        function renderQuestion() {
            const q = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.q}`;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn p-4 rounded-xl text-right ${userAnswers[currentQuestionIndex] === idx ? 'selected' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => { userAnswers[currentQuestionIndex] = idx; renderQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('next-btn').classList.toggle('hidden', currentQuestionIndex === 24);
            document.getElementById('submit-btn').classList.toggle('hidden', currentQuestionIndex !== 24);
        }

        function prevQuestion() { if(currentQuestionIndex > 0) { currentQuestionIndex--; renderQuestion(); } }
        function nextQuestion() { if(currentQuestionIndex < 24) { currentQuestionIndex++; renderQuestion(); } }

        function submitQuiz() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('results-container').classList.remove('hidden');
            const list = document.getElementById('mistakes-list');
            userAnswers.forEach((ans, i) => {
                if (ans !== quizData[i].a) {
                    const div = document.createElement('div');
                    div.className = "p-4 bg-red-900/20 border border-red-800 rounded-lg";
                    div.innerHTML = `<strong>س: ${quizData[i].q}</strong><br>إجابتك: ${quizData[i].options[ans] || 'لم تجب'}<br><span class="text-green-400">الإجابة الصحيحة: ${quizData[i].options[quizData[i].a]}</span>`;
                    list.appendChild(div);
                }
            });
        }

        function startTimer() {
            setInterval(() => {
                timeRemaining--;
                document.getElementById('timer-display').innerText = Math.floor(timeRemaining/60) + ":" + (timeRemaining%60).toString().padStart(2, '0');
                if(timeRemaining <= 0) submitQuiz();
            }, 1000);
        }
    </script>
</body>
</html>
