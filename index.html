<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC Monthly Quiz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        :root {
            --bg-main: #000000;
            --bg-container: #090014;
            --bg-input: #120024;
            --text-main: #ffffff;
            --border-color: #4c1d95;
            --stc-purple: #4F008C;
            --neon-purple: #a855f7;
            --option-bg: #1e003b;
            --option-hover: #3b0764;
            --option-selected: #6b21a8;
            --shadow-neon: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .panel { background-color: var(--bg-container); border: 1px solid var(--border-color); box-shadow: var(--shadow-neon); }
        .input-box { background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); }
        .input-box:focus { box-shadow: var(--shadow-neon); border-color: var(--neon-purple); outline: none; }
        
        .option-btn { background-color: var(--option-bg); border: 1px solid var(--border-color); transition: all 0.2s ease; cursor: pointer; }
        .option-btn:hover:not(.selected) { background-color: var(--option-hover); transform: translateY(-2px); }
        .option-btn.selected { background-color: var(--option-selected); border-color: var(--neon-purple); box-shadow: inset 0 0 10px rgba(168,85,247,0.8); }

        .btn-stc { background-color: var(--stc-purple); transition: all 0.3s; }
        .btn-stc:hover:not(:disabled) { background-color: #6b21a8; box-shadow: var(--shadow-neon); }
        .btn-stc:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .timer-warning { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Language toggle positioning */
        .lang-toggle { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        html[dir="rtl"] .lang-toggle { right: auto; left: 20px; }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center relative">

    <!-- LANGUAGE TOGGLE -->
    <button onclick="toggleLang()" class="lang-toggle bg-gray-800 border border-purple-500 text-white px-4 py-2 rounded-full font-bold hover:bg-gray-700 transition shadow-[0_0_10px_rgba(168,85,247,0.3)]">
        <i class="fa-solid fa-globe mr-1"></i> <span id="lang-btn-text">العربية</span>
    </button>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="panel rounded-2xl p-8 max-w-md w-full text-center z-50">
        <div class="h-16 w-20 bg-white rounded-xl mx-auto flex items-center justify-center mb-6 p-2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/00/Stc_logo.svg" alt="STC" class="h-full object-contain filter brightness-0 invert">
        </div>
        <h2 id="login-title" class="text-3xl font-bold mb-2 text-purple-400">STC Quiz Portal</h2>
        <p id="login-sub" class="text-gray-400 text-sm mb-2">Agent Authentication Required</p>
        <p id="login-hint" class="text-neon-purple text-xs font-bold mb-6">(Must contain .c@stc.com.kw)</p>
        
        <input type="text" id="login-user" class="input-box w-full rounded-xl px-4 py-3 mb-4 text-left" dir="ltr" placeholder="Username (e.g. name.c@stc.com.kw)">
        <input type="password" id="login-pass" class="input-box w-full rounded-xl px-4 py-3 mb-6 text-left" dir="ltr" placeholder="Password" onkeypress="if(event.key === 'Enter') login()">
        
        <p id="login-err" class="text-red-500 text-sm mb-4 hidden font-bold">Invalid credentials!</p>
        <button onclick="login()" id="btn-login" class="btn-stc w-full text-white py-3 rounded-xl font-bold text-lg">Login</button>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="panel rounded-2xl p-10 max-w-2xl w-full hidden flex-col">
        <h1 id="greeting-msg" class="text-3xl md:text-4xl font-bold mb-4 text-purple-400 leading-tight"></h1>
        <p id="dash-desc" class="text-lg text-gray-300 mb-10 leading-relaxed"></p>
        
        <div class="bg-black/50 border border-purple-800 rounded-xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 hover:border-purple-500 transition duration-300">
            <div class="text-center md:text-left rtl:md:text-right">
                <h3 id="dash-quiz-title" class="text-2xl font-bold text-white"><i class="fa-regular fa-calendar-check text-purple-500 mx-2"></i> June 2026 Quiz</h3>
                <p id="dash-quiz-info" class="text-sm text-gray-400 mt-1">25 Questions • 15 Minutes limit</p>
            </div>
            <button onclick="startQuiz()" id="btn-attempt" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-xl font-bold shadow-[0_0_15px_rgba(34,197,94,0.3)] transition transform hover:scale-105 flex items-center gap-2">
                Attempt <i class="fa-solid fa-play"></i>
            </button>
        </div>
    </div>

    <!-- 3. QUIZ INTERFACE -->
    <div id="quiz-screen" class="panel rounded-2xl p-6 md:p-10 max-w-4xl w-full hidden flex-col h-[85vh]">
        <!-- Header -->
        <div class="flex justify-between items-end border-b border-purple-800 pb-4 mb-6">
            <div>
                <h2 id="quiz-header-title" class="text-2xl font-bold text-purple-400">June 2026 Quiz</h2>
                <p class="text-gray-400 mt-1"><span id="lbl-question">Question</span> <span id="q-current" class="text-white font-bold">1</span> <span id="lbl-of">of</span> 25</p>
            </div>
            <div class="text-right rtl:text-left">
                <p id="lbl-timer" class="text-sm text-gray-400 mb-1">Time Remaining</p>
                <div id="timer" class="text-3xl font-mono font-bold text-green-400" dir="ltr">15:00</div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="flex-grow overflow-y-auto px-2 custom-scrollbar">
            <h3 id="question-text" class="text-xl md:text-2xl font-bold text-white mb-6 leading-relaxed"></h3>
            <div id="options-container" class="flex flex-col gap-3 mb-6"></div>
        </div>

        <!-- Navigation Footer -->
        <div class="border-t border-purple-800 pt-6 mt-4 flex justify-between items-center">
            <button onclick="prevQ()" id="btn-prev" class="px-6 py-3 rounded-xl font-bold border border-purple-600 hover:bg-purple-900/50 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
                <i class="fa-solid fa-arrow-left rtl:rotate-180"></i> <span id="lbl-prev">Previous</span>
            </button>
            
            <button onclick="nextQ()" id="btn-next" class="btn-stc px-8 py-3 rounded-xl font-bold text-white flex items-center gap-2">
                <span id="lbl-next">Next</span> <i class="fa-solid fa-arrow-right rtl:rotate-180"></i>
            </button>

            <button onclick="submitQuiz()" id="btn-submit" class="bg-green-600 hover:bg-green-500 px-8 py-3 rounded-xl font-bold text-white hidden disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                <span id="lbl-submit">Submit Quiz</span> <i class="fa-solid fa-check"></i>
            </button>
        </div>
        <p id="submit-warning" class="text-red-400 text-sm text-center mt-3 hidden font-bold"></p>
    </div>

    <!-- 4. RESULTS SCREEN -->
    <div id="results-screen" class="panel rounded-2xl p-6 md:p-10 max-w-4xl w-full hidden flex-col h-[85vh]">
        <div class="text-center mb-8 border-b border-purple-800 pb-8">
            <i class="fa-solid fa-ranking-star text-5xl text-yellow-400 mb-4"></i>
            <h2 id="res-title" class="text-3xl font-bold text-white mb-2">Quiz Completed</h2>
            <p class="text-gray-400"><span id="lbl-agent">Agent:</span> <span id="res-agent" class="text-white font-bold"></span></p>
            <div class="mt-6 inline-block bg-black border border-purple-500 rounded-2xl p-6 shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                <p id="lbl-score" class="text-sm text-purple-300 uppercase tracking-wider mb-1">Final Score</p>
                <p class="text-6xl font-black text-white" dir="ltr"><span id="res-score" class="text-neon-purple"></span> <span class="text-2xl text-gray-500">/ 25</span></p>
            </div>
        </div>

        <h3 id="mistakes-title" class="text-xl font-bold text-red-400 mb-4">Review Your Mistakes:</h3>
        <div id="mistakes-container" class="flex-grow overflow-y-auto px-2 flex flex-col gap-4 text-left rtl:text-right"></div>
    </div>

                opt_en: ["Sit in silence.", "Inform customer of delay, make polite small talk/hold.", "Hold without saying anything.", "Ask them to call back."], 
                opt_ar: ["الجلوس في صمت.", "إبلاغ العميل بالتأخير، والتحدث بلباقة أو وضعهم على الانتظار.", "الانتظار دون قول شيء.", "الطلب منهم الاتصال لاحقاً."], 
                a: 1 
            },
            { 
                q_en: "Customer is rambling about personal issues unrelated to service. Handle it by:", 
                q_ar: "العميل يتحدث بإسهاب عن أمور شخصية لا علاقة لها بالخدمة. تعامل مع هذا عن طريق:",
                opt_en: ["Interrupting aggressively.", "Letting them talk indefinitely.", "Listening briefly, then gently steering back to troubleshooting.", "Disconnecting."], 
                opt_ar: ["المقاطعة بعدوانية.", "تركهم يتحدثون إلى ما لا نهاية.", "الاستماع لفترة وجيزة، ثم توجيه الحديث بلطف نحو حل المشكلة.", "فصل المكالمة."], 
                a: 2 
            },
            { 
                q_en: "Customer insists they made no international calls, but logs show they did. Proceed by:", 
                q_ar: "يصر العميل أنه لم يقم بمكالمات دولية، لكن السجلات تظهر عكس ذلك. تابع عن طريق:",
                opt_en: ["Calling them a liar.", "Explaining logs calmly, suggesting others used it, offer block.", "Waiving the bill.", "Refusing to explain."], 
                opt_ar: ["نعتهم بالكذب.", "شرح السجلات بهدوء، اقتراح أن شخصاً آخر استخدمها، عرض حظر الخدمة.", "إسقاط الفاتورة.", "رفض التفسير."], 
                a: 1 
            },
            { 
                q_en: "Customer begs you to waive a strict non-waivable fee. What do you do?", 
                q_ar: "يتوسل إليك العميل لإلغاء رسوم غير قابلة للإلغاء. ماذا تفعل؟",
                opt_en: ["Remove it anyway.", "Empathize, explain policy firmly, offer installments if available.", "Say management is greedy.", "Hang up."], 
                opt_ar: ["إزالتها على أي حال.", "التعاطف، شرح السياسة بحزم، وتقديم خيارات تقسيط إن وجدت.", "القول بأن الإدارة جشعة.", "إغلاق الخط."], 
                a: 1 
            },
            { 
                q_en: "You are having extreme difficulty understanding a heavy accent. What should you do?", 
                q_ar: "تواجه صعوبة شديدة في فهم لهجة ثقيلة. ماذا يجب أن تفعل؟",
                opt_en: ["Guess what they are saying.", "Say you can't understand and hang up.", "Politely ask to repeat and confirm understanding.", "Transfer immediately."], 
                opt_ar: ["تخمين ما يقولونه.", "القول بأنك لا تفهم وإغلاق الخط.", "الطلب بلباقة بالتكرار وتأكيد الفهم.", "التحويل فوراً."], 
                a: 2 
            },
            { 
                q_en: "The caller is a young child reporting broken WiFi. Proper procedure?", 
                q_ar: "المتصل طفل صغير يبلغ عن تعطل الواي فاي. ما هو الإجراء الصحيح؟",
                opt_en: ["Troubleshoot with the child.", "Ask the child to put an adult/account holder on the phone.", "Reset router blindly.", "Hang up."], 
                opt_ar: ["حل المشكلة مع الطفل.", "الطلب من الطفل إعطاء الهاتف لشخص بالغ/صاحب الحساب.", "إعادة ضبط الراوتر بشكل أعمى.", "إغلاق الخط."], 
                a: 1 
            },
            { 
                q_en: "Customer extensively praises your service. Most professional response?", 
                q_ar: "عميل يمدح خدمتك بشكل كبير. ما هو الرد الأكثر احترافية؟",
                opt_en: ["Ask for a tip.", "Brag about being the best.", "Thank them sincerely and ask if they need further help.", "Keep them on phone to boost metrics."], 
                opt_ar: ["طلب بقشيش.", "التباهي بأنك الأفضل.", "شكرهم بصدق وسؤالهم عما إذا كانوا بحاجة لمساعدة أخرى.", "إبقائهم على الهاتف لتحسين مقاييسك."], 
                a: 2 
            },
            { 
                q_en: "B2B customer calls you (a B2C agent) by mistake. Best action?", 
                q_ar: "عميل شركات (B2B) اتصل بك (موظف أفراد B2C) بالخطأ. ما هو أفضل إجراء؟",
                opt_en: ["Troubleshoot using B2C tools.", "Warm transfer to B2B team.", "Tell them to look up the number themselves.", "Close ticket."], 
                opt_ar: ["حل المشكلة باستخدام أدوات الأفراد.", "التحويل الدافئ لفريق قطاع الأعمال.", "إخبارهم بالبحث عن الرقم بأنفسهم.", "إغلاق التذكرة."], 
                a: 1 
            },
            { 
                q_en: "Customer shouts: 'I've called 3 times today and nobody fixed this!' Response?", 
                q_ar: "يصرخ العميل: (لقد اتصلت 3 مرات اليوم ولم يحل أحد المشكلة!). كيف ترد؟",
                opt_en: ["Apologize, take ownership, review previous notes.", "Say they spoke to bad agents.", "Tell them to stop shouting.", "Put on hold as punishment."], 
                opt_ar: ["الاعتذار، تولي المسؤولية الشخصية، ومراجعة الملاحظات السابقة.", "القول بأنهم تحدثوا لموظفين سيئين.", "إخبارهم بالتوقف عن الصراخ.", "وضعهم على الانتظار كعقاب."], 
                a: 0 
            },
            { 
                q_en: "2 minutes before your shift ends, a complex fiber issue comes in. Action?", 
                q_ar: "قبل دقيقتين من انتهاء ورديتك، وردت مشكلة فايبر معقدة. ماذا تفعل؟",
                opt_en: ["Transfer to random queue.", "Pretend you can't hear.", "Handle it fully with standard professionalism (overtime).", "Tell them to call back."], 
                opt_ar: ["التحويل لطابور عشوائي.", "التظاهر بعدم السماع.", "معالجتها بالكامل باحترافية (وقت إضافي).", "إخبارهم بالاتصال لاحقاً."], 
                a: 2 
            }
        ];

        let lang = 'en'; // Default language
        let agentName = "";
        let currentQ = 0;
        let userAnswers = new Array(25).fill(null);
        let timeRemaining = 900; // 15 mins
        let timerInterval;

        // ALLOWED USERS ONLY
        const allowedUsers = ['ahmad.zbibo.c@stc.com.kw', 'essan.balla.c@stc.com.kw'];

        // --- LANGUAGE LOGIC ---
        function toggleLang() {
            lang = lang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            updateTexts();
            if(!document.getElementById('quiz-screen').classList.contains('hidden')) {
                renderQuestion();
            }
            if(!document.getElementById('results-screen').classList.contains('hidden')) {
                processResults(true); // Re-render results in new language without resetting
            }
        }

        function updateTexts() {
            const t = i18n[lang];
            document.getElementById('lang-btn-text').innerText = t.langBtn;
            
            // Login
            document.getElementById('login-title').innerText = t.loginTitle;
            document.getElementById('login-sub').innerText = t.loginSub;
            document.getElementById('login-hint').innerText = t.loginHint;
            document.getElementById('login-user').placeholder = t.userPlace;
            document.getElementById('login-pass').placeholder = t.passPlace;
            document.getElementById('btn-login').innerText = t.btnLogin;
            document.getElementById('login-err').innerText = t.loginErr;
            
            // Dashboard
            if(agentName) {
                document.getElementById('greeting-msg').innerHTML = t.greetUser.replace('{name}', agentName);
            }
            document.getElementById('dash-desc').innerHTML = t.dashDesc;
            document.getElementById('dash-quiz-title').innerHTML = `<i class="fa-regular fa-calendar-check text-purple-500 mx-2"></i> ${t.quizTitle}`;
            document.getElementById('dash-quiz-info').innerText = t.quizInfo;
            document.getElementById('btn-attempt').innerHTML = `${t.btnAttempt} <i class="fa-solid fa-play mx-2"></i>`;
            
            // Quiz
            document.getElementById('quiz-header-title').innerText = t.quizTitle;
            document.getElementById('lbl-question').innerText = t.lblQuestion;
            document.getElementById('lbl-of').innerText = t.lblOf;
            document.getElementById('lbl-timer').innerText = t.lblTimer;
            document.getElementById('lbl-prev').innerText = t.lblPrev;
            document.getElementById('lbl-next').innerText = t.lblNext;
            document.getElementById('lbl-submit').innerText = t.lblSubmit;
            
            // Results static labels
            document.getElementById('res-title').innerText = t.resTitle;
            document.getElementById('lbl-agent').innerText = t.lblAgent;
            document.getElementById('lbl-score').innerText = t.lblScore;
            document.getElementById('mistakes-title').innerText = t.mistakesTitle;
            
            checkSubmissionStatus(); // To update warning string
        }

        // --- AUTH ---
        function login() {
            const user = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value.trim();
            
            if (allowedUsers.includes(user) && pass === 'Stc123') {
                // Extract Name from email
                let rawName = user.split('.c@')[0].replace('.', ' ');
                agentName = rawName.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('flex');
                
                updateTexts(); // Update greeting
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }

        // --- QUIZ START ---
        function startQuiz() {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('flex');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');
            
            renderQuestion();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                let display = document.getElementById('timer');
                display.innerText = `${m}:${s.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 180) display.classList.add('timer-warning');
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    forceSubmit();
                }
            }, 1000);
        }

        // --- RENDER ---
        function renderQuestion() {
            const q = quizData[currentQ];
            const qText = lang === 'en' ? q.q_en : q.q_ar;
            const qOpts = lang === 'en' ? q.opt_en : q.opt_ar;
            
            document.getElementById('q-current').innerText = currentQ + 1;
            document.getElementById('question-text').innerText = `${currentQ + 1}. ${qText}`;
            
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            qOpts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left rtl:text-right p-5 rounded-xl text-lg font-medium text-white mb-3 ${userAnswers[currentQ] === idx ? 'selected' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => {
                    userAnswers[currentQ] = idx; 
                    renderQuestion(); // Re-render to show selection
                    checkSubmissionStatus();
                };
                optsContainer.appendChild(btn);
            });

            document.getElementById('btn-prev').disabled = (currentQ === 0);
            
            const btnNext = document.getElementById('btn-next');
            const btnSub = document.getElementById('btn-submit');
            
            if (currentQ === 24) {
                btnNext.classList.add('hidden');
                btnSub.classList.remove('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnSub.classList.add('hidden');
            }
            
            checkSubmissionStatus();
        }

        // --- NAVIGATION ---
        function prevQ() { if(currentQ > 0) { currentQ--; renderQuestion(); } }
        function nextQ() { if(currentQ < 24) { currentQ++; renderQuestion(); } }

        // --- SUBMIT LOGIC ---
        function checkSubmissionStatus() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const btnSub = document.getElementById('btn-submit');
            const warning = document.getElementById('submit-warning');
            const t = i18n[lang];
            
            if (currentQ === 24) {
                if (answeredCount === 25) {
                    btnSub.disabled = false;
                    warning.classList.add('hidden');
                } else {
                    btnSub.disabled = true;
                    warning.classList.remove('hidden');
                    warning.innerText = t.warnSubmit.replace('{ans}', answeredCount);
                }
            }
        }

        function submitQuiz() {
            if (userAnswers.includes(null)) return; // Double check
            processResults(false);
        }

        function forceSubmit() {
            processResults(false);
        }

        function processResults(isLangToggle = false) {
            if(!isLangToggle) clearInterval(timerInterval);
            
            let score = 0;
            const mistakesBox = document.getElementById('mistakes-container');
            mistakesBox.innerHTML = '';
            const t = i18n[lang];
            
            quizData.forEach((q, i) => {
                const userAns = userAnswers[i];
                if (userAns === q.a) {
                    score++;
                } else {
                    const div = document.createElement('div');
                    div.className = "bg-red-900/10 border border-red-900/50 p-5 rounded-xl";
                    
                    const qText = lang === 'en' ? q.q_en : q.q_ar;
                    const qOpts = lang === 'en' ? q.opt_en : q.opt_ar;
                    
                    const uText = userAns !== null ? qOpts[userAns] : t.lblNoAns;
                    
                    div.innerHTML = `
                        <p class="font-bold text-gray-200 mb-3">${t.qPrefix}${i+1}: ${qText}</p>
                        <p class="text-red-400 mb-1"><i class="fa-solid fa-xmark mx-2"></i> ${t.lblYourAns} ${uText}</p>
                        <p class="text-green-400 font-bold"><i class="fa-solid fa-check mx-2"></i> ${t.lblCorrectAns} ${qOpts[q.a]}</p>
                    `;
                    mistakesBox.appendChild(div);
                }
            });

            if (score === 25) {
                mistakesBox.innerHTML = `<p class="text-green-400 font-bold text-xl text-center py-10">${t.perfectScore}</p>`;
                document.getElementById('mistakes-title').classList.add('hidden');
            } else {
                document.getElementById('mistakes-title').classList.remove('hidden');
            }

            if(!isLangToggle) {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('flex');
                
                document.getElementById('results-screen').classList.remove('hidden');
                document.getElementById('results-screen').classList.add('flex');
                
                document.getElementById('res-agent').innerText = agentName;
                document.getElementById('res-score').innerText = score;
            }
        }

        // Init language texts on load
        updateTexts();
    </script>
</body>
</html>
